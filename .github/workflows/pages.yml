name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The repository is currently also configured for branch/Jekyll Pages.
      # That hidden workflow deploys the raw repository after this workflow and
      # can overwrite the Vite build. Waiting here makes the Vite artifact the
      # final deployment until Pages Source is switched to "GitHub Actions".
      - name: Wait for branch Pages deployment
        run: sleep 60
      - name: Deploy Vite build
        id: deployment
        uses: actions/deploy-pages@v4
